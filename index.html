<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ひよまるくん リズムゲーム試作 v0.7.4</title>
<style>
:root{
  --ink:#5a5c86;
  --panel:#ffffffdd;
  --line:#dcd8ff;
  --pink:#ff9fc8;
  --blue:#8fd8ff;
  --yellow:#ffd76a;
  --green:#a9e6a3;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:#f7f1ff}
body{display:flex;justify-content:center;padding:8px;touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior:none}
#app{width:min(94vw,620px)}
.topbar{
  width:min(88vw,560px);margin:0 auto 8px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:10px 14px;margin-bottom:10px
}
.title{font-weight:800;font-size:18px}
.meta{display:flex;gap:8px;flex-wrap:wrap;font-size:13px}
.badge{background:#fff;border:2px solid #ece9ff;border-radius:999px;padding:5px 10px}
#game{
  position:relative;overflow:hidden;aspect-ratio:1/1;min-height:0;width:min(88vw,560px);margin:0 auto;
  border:3px solid #e3ddff;border-radius:26px;background:#eee;box-shadow:0 14px 28px #6c65a015
}
.stage{position:absolute;inset:0;transition:opacity .45s ease}
.stage.hidden{opacity:0;pointer-events:none}
#sceneLayer{position:absolute;inset:0}

/* -------- backgrounds -------- */
.scene-room{background:linear-gradient(#ead8ff,#ffe6d6)}
.scene-room:before,.scene-room:after{content:"";position:absolute;top:0;width:34%;height:44%;background:#b889c950}
.scene-room:before{left:0;clip-path:polygon(0 0,100% 0,0 100%)}
.scene-room:after{right:0;clip-path:polygon(0 0,100% 0,100% 100%)}
.window{position:absolute;left:50%;top:8%;transform:translateX(-50%);width:26%;height:26%;border:9px solid #d59db3;border-radius:34px;background:#aee2ff}
.window:before,.window:after{content:"";position:absolute;background:#d59db3}
.window:before{width:8px;height:100%;left:50%}
.window:after{height:8px;width:100%;top:50%}
.floor{position:absolute;left:0;right:0;bottom:0;height:34%;background:repeating-linear-gradient(90deg,#deb98b 0 30px,#e7c69c 30px 60px)}
.rug{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:48%;height:18%;border-radius:50%;background:#f8ecff;border:7px solid #eddcff}
.bed{position:absolute;left:8%;bottom:27%;width:24%;height:13%;background:#ccb5ef;border-radius:20px}
.shelf{position:absolute;right:8%;bottom:24%;width:13%;height:27%;background:#b98ca2;border-radius:12px}
.lamp{position:absolute;left:6%;bottom:37%;width:5%;aspect-ratio:1;border-radius:50%;background:#ffe07a;box-shadow:0 0 28px #ffe9a4}

.scene-beach{background:linear-gradient(#bfeaff 0 38%,#7ed9ef 38% 67%,#f4d99f 67%)}
.scene-beach .rug{background:#fff0c8;border-color:#f3d7a0}
.palm{position:absolute;right:10%;bottom:29%;width:18px;height:37%;background:#b98555;transform:rotate(3deg);transform-origin:bottom}
.palm:before{content:"";position:absolute;left:50%;top:-15px;width:150px;height:100px;transform:translateX(-50%);background:#79d27c;clip-path:polygon(50% 50%,0 0,43% 40%,35% 0,49% 40%,55% 0,55% 41%,100% 8%,63% 47%,100% 60%,61% 54%,72% 100%,53% 59%,32% 100%,46% 55%,0 64%,42% 50%)}
.shell{position:absolute;width:20px;height:12px;border-radius:50% 50% 30% 30%;background:#ffc4d8;border:2px solid #e9a9bf}
.wave{position:absolute;left:0;right:0;top:61%;height:16px;background:radial-gradient(35px 12px at 35px 0,#fff 98%,transparent 100%) 0 0/70px 16px repeat-x;opacity:.7}

.scene-forest{background:linear-gradient(#505991,#8d76aa 55%,#486b60)}
.moon{position:absolute;left:12%;top:8%;width:9%;aspect-ratio:1;border-radius:50%;background:#fff3bd;box-shadow:0 0 25px #fff0b260}
.moon:after{content:"";position:absolute;width:82%;height:82%;border-radius:50%;background:#59649b;left:36%;top:-5%}
.tree{position:absolute;bottom:21%;width:90px;height:43%;background:#36574c;border-radius:50% 50% 14% 14%}
.tree:after{content:"";position:absolute;left:40%;bottom:-25%;width:20%;height:42%;background:#2d493f}
.owl{position:absolute;right:13%;top:17%;width:44px;height:36px;border-radius:50%;background:#28344d}
.owl:before,.owl:after{content:"";position:absolute;top:10px;width:8px;height:8px;border-radius:50%;background:#fff6bd}
.owl:before{left:9px}.owl:after{right:9px}
.scene-forest .rug{background:#d9f1dd;border-color:#b8dbbf}

.scene-lighthouse{background:linear-gradient(#ffdcbf 0 36%,#aee0f7 36% 67%,#d9d0c2 67%)}
.sun{position:absolute;left:10%;top:8%;width:10%;aspect-ratio:1;border-radius:50%;background:#fff0aa;box-shadow:0 0 35px #ffe7a980}
.lighthouse{position:absolute;right:15%;bottom:39%;width:58px;height:34%;background:repeating-linear-gradient(#fff 0 58px,#ff9eac 58px 80px);border:3px solid #bda9af}
.lighthouse:before{content:"";position:absolute;left:-10px;right:-10px;top:-28px;height:28px;background:#dc5c6f;border-radius:8px 8px 0 0}
.lighthouse:after{content:"";position:absolute;left:12px;right:12px;top:-50px;height:24px;border-radius:50%;background:#fff0a9;border:3px solid #bdaa85}
.tetrapod{position:absolute;width:48px;height:20px;border-radius:50%;background:#8793a7}
.tetrapod:before,.tetrapod:after{content:"";position:absolute;background:#8793a7}
.tetrapod:before{left:17px;top:-14px;width:14px;height:48px}
.tetrapod:after{left:5px;top:5px;width:38px;height:12px}
.scene-lighthouse .rug{background:#f3eefb;border-color:#dad1ed}

/* -------- character -------- */
#characterWrap{
  position:absolute;left:50%;bottom:21%;width:25%;min-width:110px;aspect-ratio:1;
  transform:translateX(-50%);transition:transform .18s ease,filter .15s ease
}
#character{position:absolute;inset:0;transform-origin:50% 68%;transition:transform .18s ease}
.shadow{position:absolute;left:25%;right:25%;bottom:4%;height:8%;background:#5b66802d;border-radius:50%}
.body{
  position:absolute;left:22%;top:22%;width:56%;height:63%;border-radius:48% 48% 46% 46%;
  background:#fff;border:4px solid #5363a4
}
.hat{
  position:absolute;left:18%;top:10%;width:62%;height:24%;border-radius:50%;
  background:#fff;border:4px solid #5363a4;transform:rotate(-7deg)
}
.hat:before{
  content:"";position:absolute;left:4%;right:4%;bottom:3%;height:43%;border-radius:0 0 60% 60%;
  background:#3db9ff
}
.hat:after{
  content:"";position:absolute;right:14%;bottom:20%;width:18%;height:28%;
  background:#3db9ff;border:3px solid #5363a4;transform:rotate(-15deg);
  clip-path:polygon(50% 0,100% 45%,70% 100%,14% 83%,0 33%)
}
.eye{position:absolute;top:43%;width:4.8%;aspect-ratio:1;border-radius:50%;background:#334383}
.eye.left{left:40%}.eye.right{right:40%}
.blush{position:absolute;top:51%;width:9%;height:6%;border-radius:50%;background:#f8bfd8aa}
.blush.left{left:31%}.blush.right{right:31%}
.beak{
  position:absolute;left:46%;top:49%;width:8%;height:8%;background:#f5b441;border:2px solid #d89324;
  transform:rotate(45deg);border-radius:2px
}
.wing{
  position:absolute;top:48%;width:20%;height:28%;background:#fff;border:4px solid #5363a4;border-radius:70% 35% 60% 40%;
  transform-origin:50% 10%;transition:transform .18s ease
}
.wing.left{left:12%;transform:rotate(12deg)}
.wing.right{right:12%;transform:scaleX(-1) rotate(12deg)}
.foot{position:absolute;bottom:5%;width:6%;height:10%;border-radius:50%;background:#edbe3e;border:2px solid #d29b22}
.foot.left{left:40%;transform:rotate(-8deg)}.foot.right{right:40%;transform:rotate(8deg)}
#fx{position:absolute;inset:-20%;pointer-events:none;opacity:0;transition:opacity .12s}
.spark{position:absolute;width:16px;height:16px;background:#ffe074;clip-path:polygon(50% 0,62% 37%,100% 50%,62% 63%,50% 100%,38% 63%,0 50%,38% 37%)}
.spark.s1{left:8%;top:36%}.spark.s2{right:7%;top:44%;background:#9ee4ff}.spark.s3{left:47%;top:0;background:#ffb7d5}
#feedback{
  position:absolute;left:50%;top:16%;transform:translateX(-50%);font-size:clamp(22px,4vw,38px);font-weight:900;
  text-shadow:0 3px 0 #fff,0 0 12px #fff;opacity:0;transition:opacity .12s,transform .12s
}
#feedback.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
#feedback.good{color:#ff78ad} #feedback.miss{color:#8890aa}

/* -------- targets and notes -------- */
.target{
  position:absolute;width:64px;height:64px;border-radius:22px;background:#ffffffd9;border:4px solid #e6e0ff;
  display:grid;place-items:center;font-size:38px;font-weight:900;box-shadow:0 8px 18px #544a7818;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;z-index:8
}
.target.active{transform:scale(1.08);box-shadow:0 0 0 6px #fff9,0 0 24px #ffd36c}
#t-up{left:50%;top:25%;transform:translateX(-50%)}
#t-down{left:50%;bottom:7%;transform:translateX(-50%)}
#t-left{left:20%;top:55%;transform:translate(-50%,-50%)}
#t-right{right:20%;top:55%;transform:translate(50%,-50%)}
.note{
  position:absolute;width:46px;height:46px;border-radius:14px;background:#fff;border:4px solid currentColor;
  display:grid;place-items:center;font-size:28px;font-weight:900;z-index:7;pointer-events:none;
  box-shadow:0 5px 12px #554b7c20
}
.note.left{color:#ff79ad}.note.right{color:#70cf72}.note.up{color:#f5b64d}.note.down{color:#7c9fff}
#hud{
  position:absolute;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;gap:10px;z-index:10;pointer-events:none
}
.hudbox{background:#ffffffdc;border:2px solid #e9e4ff;border-radius:16px;padding:7px 11px;font-weight:800;font-size:13px}
#magicWrap{
  position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(40%,310px);height:18px;
  background:#ffffffcc;border:3px solid #e8e2ff;border-radius:999px;overflow:hidden;z-index:10
}
#magicBar{height:100%;width:0%;background:linear-gradient(90deg,#8fd8ff,#ffb2d3,#ffd76a);transition:width .2s ease}
#startOverlay,#resultOverlay{
  position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:#f8f2ffdd;backdrop-filter:blur(5px)
}
#resultOverlay{display:none}
.card{
  width:min(86%,520px);background:#fffffff0;border:3px solid #dfd8ff;border-radius:28px;padding:24px;text-align:center;
  box-shadow:0 20px 48px #544b7b25
}
.card h1,.card h2{margin:0 0 10px;color:#6875c8}
.card p{line-height:1.7}
button{
  border:0;border-radius:999px;padding:13px 24px;font-size:17px;font-weight:900;background:#7aa9ff;color:#fff;
  box-shadow:0 8px 18px #7aa9ff42;cursor:pointer
}
button:active{transform:translateY(1px)}
.popcorn{font-size:72px;margin:8px}
.flower{font-size:86px;margin:8px}
.smallnote{font-size:12px;color:#777b99}
@media(max-width:700px){
  body{padding:6px}
  #app{width:100%}
  .topbar{
    width:min(88vw,520px);
    padding:6px 8px;
    margin:0 auto 6px;
  }
  .title{font-size:13px}
  .meta{gap:4px}
  .badge{font-size:10px;padding:3px 6px}
  #game{
    width:min(88vw,520px);
    aspect-ratio:1/1;
    margin:0 auto;
  }
  .target{
    width:52px;
    height:52px;
    font-size:26px;
    border-radius:16px;
    border-width:3px;
  }
  #t-up{top:24%}
  #t-left{left:20%;top:55%}
  #t-right{right:20%;top:55%}
  #t-down{bottom:7%}
  #characterWrap{
    width:24%;
    min-width:96px;
    bottom:21%;
  }
  .hudbox{font-size:10px;padding:4px 7px}
  #hud{left:8px;right:8px;top:7px}
  #magicWrap{top:8px;width:36%;height:14px}
  .card{width:88%;padding:16px}
  .card h1{font-size:24px}
  .card p{font-size:13px}
  button{padding:11px 20px;font-size:15px}
}
  .topbar{padding:8px 10px;margin-bottom:6px}
  .title{font-size:15px}
  .badge{font-size:11px;padding:4px 7px}
  #game{width:100%;aspect-ratio:1/1}
  .target{width:58px;height:58px;font-size:29px;border-radius:18px}
  #t-up{top:24%}
  #t-left{left:14%;top:55%}
  #t-right{right:14%;top:55%}
  #t-down{bottom:7%}
  #characterWrap{width:29%;min-width:120px;bottom:21%}
  .hudbox{font-size:11px;padding:5px 8px}
  #magicWrap{top:10px;width:38%}
  .card{width:90%;padding:18px}
}
  .target{width:64px;height:64px;font-size:32px;border-radius:19px}
  #t-left{left:17%} #t-right{right:17%}
  #characterWrap{width:31%}
}

#countdownOverlay{position:absolute;inset:0;z-index:26;display:none;place-items:center;pointer-events:none;background:rgba(250,246,255,.16)}
#countdownText{font-size:clamp(74px,18vw,150px);font-weight:1000;color:#fff;text-shadow:0 5px 0 #7787d8,0 0 18px #fff,0 0 34px #ffb9dc;transform:scale(.76);opacity:0}
#countdownText.pop{animation:countPop .72s ease both}
#countdownText.go{color:#fff7a8;text-shadow:0 5px 0 #f29b62,0 0 18px #fff,0 0 36px #ffd67e}
@keyframes countPop{0%{transform:scale(.58);opacity:0}24%{transform:scale(1.13);opacity:1}68%{transform:scale(1);opacity:1}100%{transform:scale(.92);opacity:0}}


@media(max-width:390px){
  .topbar{width:86vw}
  #game{width:86vw}
  .target{width:48px;height:48px;font-size:24px}
  #characterWrap{width:23%;min-width:88px}
}


/* ===== v0.6.2 本番候補背景 ===== */
#sceneLayer{
  background-position:center center !important;
  background-size:cover !important;
  background-repeat:no-repeat !important;
  transition:opacity .42s ease, filter .42s ease;
}
#sceneLayer.scene-room{background-image:url("bg_room.png") !important;}
#sceneLayer.scene-beach{background-image:url("bg_beach.png") !important;}
#sceneLayer.scene-forest{background-image:url("bg_forest.png") !important;}
#sceneLayer.scene-lighthouse{background-image:url("bg_lighthouse.png") !important;}

/* 背景画像が主役なので、旧ボーン背景の小物は非表示 */
#sceneLayer > *{display:none !important;}

/* UIの可読性を少しだけ上げる */
#sceneLayer:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(
    to bottom,
    rgba(255,255,255,.04) 0%,
    rgba(255,255,255,0) 34%,
    rgba(255,255,255,.025) 68%,
    rgba(255,255,255,.07) 100%
  );
}


/* ===== v0.6.2.2 GitHub Pages absolute-background fix ===== */
#sceneLayer.scene-room {
  background: url("bg_room.png") center center / cover no-repeat !important;
}
#sceneLayer.scene-beach {
  background: url("bg_beach.png") center center / cover no-repeat !important;
}
#sceneLayer.scene-forest {
  background: url("bg_forest.png") center center / cover no-repeat !important;
}
#sceneLayer.scene-lighthouse {
  background: url("bg_lighthouse.png") center center / cover no-repeat !important;
}
#sceneLayer::before,
#sceneLayer::after {
  display:none !important;
  content:none !important;
}


#soundToggle{
  border:2px solid #e4defe;
  background:#ffffffdd;
  color:#6670aa;
  box-shadow:none;
  padding:7px 12px;
  font-size:13px;
  border-radius:999px;
  cursor:pointer;
  min-width:88px;
}
#soundToggle:active{transform:scale(.98)}
#audioStatus{
  position:absolute;
  right:12px;
  bottom:10px;
  z-index:22;
  font-size:11px;
  color:#68709b;
  background:#ffffffc9;
  border:1px solid #e8e3ff;
  border-radius:999px;
  padding:4px 8px;
  opacity:0;
  transition:opacity .2s ease;
  pointer-events:none;
}
#audioStatus.show{opacity:1}








/* ===== v0.6.2 本番ひよまる PNGモーション ===== */
#characterWrap{
  width:31%;
  min-width:118px;
  bottom:18%;
}
#character{
  inset:-10%;
  transform-origin:50% 72%;
  transition:transform .11s ease;
}
#characterSprite{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
  filter:drop-shadow(0 5px 5px rgba(61,72,126,.12));
}
#character.sprite-pop{
  animation:hiyoSpritePop .22s ease;
}
#character.sprite-miss{
  animation:hiyoMissShake .22s ease;
}
@keyframes hiyoSpritePop{
  0%{transform:translateY(0) scale(.98)}
  45%{transform:translateY(-4px) scale(1.045)}
  100%{transform:translateY(0) scale(1)}
}
@keyframes hiyoMissShake{
  0%,100%{transform:translateX(0) rotate(0)}
  25%{transform:translateX(-4px) rotate(-3deg)}
  55%{transform:translateX(4px) rotate(3deg)}
  80%{transform:translateX(-2px) rotate(-1deg)}
}
.body,.hat,.eye,.blush,.beak,.wing,.foot{display:none !important;}
@media(max-width:700px){
  #characterWrap{width:30%;min-width:104px;bottom:18%}
}
@media(max-width:390px){
  #characterWrap{width:29%;min-width:94px;bottom:18%}
}


/* v0.6.2: success sparkle linger */
#fx{
  transition:opacity .14s ease;
}
#fx .spark{
  animation-duration:.62s !important;
}


/* v0.6.2: long sparkle combo pulse */
#character.sparkle-pulse{
  animation:hiyoSparklePulse .24s ease;
}
@keyframes hiyoSparklePulse{
  0%,100%{transform:translateY(-7px) scale(1.02)}
  25%{transform:translateX(-3px) translateY(-7px) rotate(-2deg) scale(1.025)}
  55%{transform:translateX(3px) translateY(-8px) rotate(2deg) scale(1.035)}
  80%{transform:translateX(-1px) translateY(-7px) rotate(-1deg) scale(1.025)}
}
#fx.pulse .spark{
  animation:hiyoFxPulse .34s ease !important;
}
@keyframes hiyoFxPulse{
  0%{opacity:0;transform:scale(.55)}
  35%{opacity:1;transform:scale(1.25)}
  100%{opacity:.85;transform:scale(1)}
}


/* ===== v0.7.4 リザルト演出 ===== */
#resultOverlay{
  display:none;
  background:
    radial-gradient(circle at 50% 45%,rgba(255,255,255,.98) 0 34%,rgba(249,244,255,.97) 68%,rgba(235,242,255,.96) 100%);
  backdrop-filter:none;
  overflow:hidden;
}
#resultScene{
  position:absolute;
  inset:0;
  display:grid;
  grid-template-rows:42% 37% 13% 8%;
  place-items:center;
  padding:5% 7% 4%;
  box-sizing:border-box;
  overflow:hidden;
}
#resultTop{
  width:100%;
  height:100%;
  display:grid;
  place-items:end center;
}
#resultHiyoWrap{
  position:relative;
  width:42%;
  min-width:136px;
  max-width:230px;
  aspect-ratio:1/1;
}
#resultHiyo{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 6px 7px rgba(72,82,135,.14));
}
#resultFlower{
  width:28%;
  max-width:142px;
  min-height:100%;
  display:grid;
  place-items:center;
  text-align:center;
  font-size:clamp(34px,11vw,72px);
  line-height:1;
  opacity:0;
  transform:scale(.25) translateY(4px);
  filter:drop-shadow(0 8px 8px rgba(77,86,135,.13));
  z-index:3;
}
#resultText{
  width:94%;
  text-align:center;
  font-size:clamp(19px,5.5vw,29px);
  font-weight:1000;
  color:#636da8;
  letter-spacing:.02em;
  opacity:0;
  transform:translateY(7px);
  z-index:4;
}
#resultHint{
  align-self:start;
  font-size:clamp(10px,2.8vw,14px);
  font-weight:700;
  color:#9a93b6;
  opacity:0;
  z-index:4;
}
#resultMagic{
  position:absolute;
  inset:13% 8% 18%;
  pointer-events:none;
  opacity:0;
  z-index:2;
}
#resultMagic span{
  position:absolute;
  color:#fff5a5;
  font-size:clamp(20px,6vw,38px);
  opacity:0;
  text-shadow:0 0 7px #fff,0 0 15px #9ce9ff,0 0 22px #ffc5e2;
}
#resultMagic span:nth-child(1){left:10%;top:25%}
#resultMagic span:nth-child(2){left:25%;top:7%}
#resultMagic span:nth-child(3){left:48%;top:2%}
#resultMagic span:nth-child(4){right:16%;top:18%}
#resultMagic span:nth-child(5){right:8%;top:49%}
#resultMagic span:nth-child(6){right:26%;bottom:8%}
#resultMagic span:nth-child(7){left:20%;bottom:14%}
#resultMagic span:nth-child(8){left:8%;top:53%}

#resultOverlay.phase-munch #resultPopcorn,
#resultOverlay.phase-munch #resultOverlay.phase-munch #resultHiyo{
  animation:resultMunch .38s ease-in-out infinite alternate;
}
#resultOverlay.phase-munch 
#resultOverlay.phase-magic #resultMagic,
#resultOverlay.phase-flower #resultMagic,
#resultOverlay.phase-text #resultMagic,
#resultOverlay.phase-done #resultMagic{opacity:1}
#resultOverlay.phase-magic #resultMagic span{
  animation:resultStar 1.15s ease-out infinite;
}
#resultOverlay.phase-magic #resultMagic span:nth-child(2),
#resultOverlay.phase-magic #resultMagic span:nth-child(6){animation-delay:.14s}
#resultOverlay.phase-magic #resultMagic span:nth-child(3),
#resultOverlay.phase-magic #resultMagic span:nth-child(7){animation-delay:.28s}
#resultOverlay.phase-magic #resultHiyo{
  animation:resultMagicHiyo .75s ease-in-out infinite alternate;
}
#resultOverlay.phase-flower #resultFlower{
  animation:resultFlowerIn 1.4s cubic-bezier(.16,.84,.25,1.16) forwards;
}
#resultOverlay.phase-flower #resultMagic span{
  animation:resultStar 1.1s ease-out infinite;
}
#resultOverlay.phase-text #resultFlower,
#resultOverlay.phase-done #resultFlower{
  opacity:1;
  transform:scale(1) translateY(0);
}
#resultOverlay.phase-text #resultText{
  animation:resultTextIn .72s ease forwards;
}
#resultOverlay.phase-done #resultText,
#resultOverlay.phase-done #resultHint{
  opacity:1;
  transform:none;
}
#resultOverlay.phase-done #resultMagic span{opacity:.6}

.retryOutside{
  display:none;
  margin:9px auto 0;
  padding:10px 20px;
  font-size:14px;
  box-shadow:0 6px 14px #7aa9ff33;
}
.retryOutside.show{display:block}

@keyframes resultMunch{
  from{transform:translateY(0) rotate(-1deg) scale(1)}
  to{transform:translateY(3px) rotate(1deg) scale(.985)}
}
  to{transform:translateY(-4px) rotate(5deg) scale(1.02)}
}
@keyframes resultMagicHiyo{
  from{transform:translateY(0) scale(1)}
  to{transform:translateY(-5px) scale(1.025)}
}
@keyframes resultStar{
  0%{opacity:0;transform:translateY(12px) rotate(0) scale(.45)}
  32%{opacity:1}
  100%{opacity:0;transform:translateY(-18px) rotate(24deg) scale(1.35)}
}
@keyframes resultFlowerIn{
  0%{opacity:0;transform:scale(.22) translateY(10px) rotate(-8deg)}
  62%{opacity:1;transform:scale(1.11) translateY(-3px) rotate(2deg)}
  100%{opacity:1;transform:scale(1) translateY(0) rotate(0)}
}
@keyframes resultTextIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}


/* v0.7.4 result character image phases */
#resultOverlay.phase-munch #resultHiyo{
  animation:resultMunch .38s ease-in-out infinite alternate;
}
#resultOverlay.phase-magic #resultHiyo{
  animation:resultMagicHiyo .75s ease-in-out infinite alternate;
}
#resultOverlay.phase-flower #resultHiyo{
  animation:resultMagicHiyo .75s ease-in-out infinite alternate;
}
#resultOverlay.phase-text #resultHiyo,
#resultOverlay.phase-done #resultHiyo{
  animation:none;
  transform:translateY(0) scale(1);
}

</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="title">ひよまるくん リズムゲーム試作 v0.6.2.2.1</div>
    <div class="meta">
      <span class="badge">コンパクト正方形UI</span><span class="badge">4面 × 15秒</span>
      <span class="badge">BGM v1入り</span>
      <span class="badge">タップ / 矢印キー</span>
    </div><button id="soundToggle" type="button" aria-pressed="false">🔊 音ON</button>


  <div id="game">
    <div id="sceneLayer" class="stage scene-room"></div>

    <div id="hud">
      <div class="hudbox" id="stageLabel">1面：ひよまるくんの部屋</div>
      <div class="hudbox" id="timerLabel">0.0 / 60.0</div>
    </div>
    <div id="magicWrap"><div id="magicBar"></div></div>

    <div id="characterWrap">
      <div class="shadow"></div>
      <div id="character">
        <img id="characterSprite" src="hiyomaru_idle.png" alt="ひよまるくん">
        <div id="fx"><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i></div>
      </div>
    </div>

    <div id="feedback">ぴったり！</div>

    <div id="t-up" class="target" data-dir="up">↑</div>
    <div id="t-left" class="target" data-dir="left">←</div>
    <div id="t-right" class="target" data-dir="right">→</div>
    <div id="t-down" class="target" data-dir="down">↓</div>

    <div id="countdownOverlay"><div id="countdownText">3</div></div>

    <div id="audioStatus">音声を準備中…</div>

    <div id="startOverlay">
      <div class="card">
        <h1>ひよまると おどろう！</h1>
        <p>「3・2・1・GO!」のあと、外から飛んでくる矢印が十字キーに重なったらタップ。<br>
        PCなら矢印キーでも遊べます。</p>
        <button id="startBtn">▶ 60秒試してみる</button>
        <div class="smallnote">※背景・BGM・ひよまるモーション実装済み。リザルト演出は試作版です。</div>
      </div>
    </div>

    <div id="resultOverlay">
      <div id="resultScene">
        <div id="resultTop">
          <div id="resultHiyoWrap">
            <img id="resultHiyo" src="hiyomaru_result_munch.png" alt="ひよまるくん">
          </div>
        </div>

        <div id="resultMagic" aria-hidden="true">
          <span>✦</span><span>✧</span><span>★</span><span>✦</span>
          <span>✧</span><span>★</span><span>✦</span><span>✧</span>
        </div>

        <div id="resultFlower">🌼</div>
        <div id="resultText">お花が咲いたよ！</div>
        <div id="resultHint">スクショして見せてね ♪</div>
      </div>
    </div>
  </div>

  <button id="retryBtn" class="retryOutside">↻ もう一回あそぶ</button>
</div>

<!-- BGM must exist in the DOM before the game script reads #bgm. -->
<audio id="tapSe" preload="auto" playsinline src="hiyomaru_tambourine_cha_v2.mp3"></audio>
<audio id="bgm" preload="auto" playsinline>
  <source src="hiyomaru_60s_bgm_v1_leadin3040.mp3" type="audio/mpeg">
</audio>

<script>
(() => {
  const STAGE_NAMES = [
    "ひよまるくんの部屋",
    "島の浜辺",
    "夜の森",
    "朝の灯台"
  ];
  const STAGE_CLASSES = ["scene-room","scene-beach","scene-forest","scene-lighthouse"];

  // 15秒 / 4フレーズ。各フレーズ最後に1拍ぶん余韻。
  // ここでは「1スロット = 15秒 / 32 = 468.75ms」として骨組みを作る。
  const SLOT = 15000 / 32;
  const TRAVEL = 1200;        // ノートが外から判定位置まで飛ぶ時間
  const HIT_WINDOW = 240;     // ±240ms
  const MISS_WINDOW = 320;

  const charts = [
    // 1面
    [
      ["LL","LL","RR","RR","UU","UU","DD","DD"],
      ["LL","LL","RR","RR","UU","UU","DD","DD"],
      ["RR","RR","LL","LL","UU","UU","DD","DD"],
      ["LL","LL","RR","RR","UU","UU","DD","DD"],
    ],
    // 2面（3連打）
    [
      ["LLL","LLL","RRR","RRR","UUU","UUU","DDD","DDD"],
      ["LLL","RRR","LLL","RRR","UUU","UUU","DDD","DDD"],
      ["RRR","RRR","LLL","LLL","UUU","DDD","UUU","DDD"],
      ["LLL","LLL","RRR","RRR","UUU","UUU","DDD","DDD"],
    ],
    // 3面（2音セットのまま、拍ごとの方向を散らす。4フレーズ目だけ少しバラける）
    [
      ["LL","DD","RR","UU","LL","DD","UU","RR"],
      ["UU","RR","DD","LL","UU","LL","RR","DD"],
      ["RR","UU","LL","DD","RR","LL","UU","DD"],
      ["LR","RL","UD","DU","LL","RR","UD","DU"],
    ],
    // 4面（ほぼ1面、最後だけ休符を多く）
    [
      ["LL","LL","RR","RR","UU","UU","DD","DD"],
      ["LL","LL","RR","RR","UU","UU","DD","DD"],
      ["RR","RR","LL","LL","UU","UU","DD","DD"],
      ["D.","D.","D.","D.","L.","L.",".U",".U"],
    ]
  ];

  const scene = document.getElementById("sceneLayer");
  const stageLabel = document.getElementById("stageLabel");
  const timerLabel = document.getElementById("timerLabel");
  const magicBar = document.getElementById("magicBar");
  const character = document.getElementById("character");
  const characterSprite = document.getElementById("characterSprite");
  const SPRITES = {
    idle: "hiyomaru_idle.png",
    leftSoft: "hiyomaru_left_soft.png",
    leftStrong: "hiyomaru_left_strong.png",
    rightSoft: "hiyomaru_right_soft.png",
    rightStrong: "hiyomaru_right_strong.png",
    wings: "hiyomaru_wings.png",
    sparkle: "hiyomaru_sparkle.png"
  };
  Object.values(SPRITES).forEach(src => {
    const img = new Image();
    img.src = src;
  });
  ["hiyomaru_result_munch.png","hiyomaru_result_happy.png","popcorn_result.png"].forEach(src=>{
    const img = new Image();
    img.src = src;
  });
  let lastSpriteDir = "";
  let sameDirCount = 0;
  let spriteResetTimer = 0;
  let sparkleHoldUntil = 0;
  const SPARKLE_HOLD_MS = 620;
  const SPARKLE_PULSE_EVERY = 3;
  let sparkleSuccessCount = 0;
  const charWrap = document.getElementById("characterWrap");
  const fx = document.getElementById("fx");
  const feedback = document.getElementById("feedback");
  const targets = {
    left: document.getElementById("t-left"),
    right: document.getElementById("t-right"),
    up: document.getElementById("t-up"),
    down: document.getElementById("t-down")
  };
  const startOverlay = document.getElementById("startOverlay");
  const resultOverlay = document.getElementById("resultOverlay");
  const resultHiyo = document.getElementById("resultHiyo");
  const resultFlower = document.getElementById("resultFlower");
  const resultText = document.getElementById("resultText");
  const resultHint = document.getElementById("resultHint");
  const startBtn = document.getElementById("startBtn");
  const retryBtn = document.getElementById("retryBtn");
  const bgm = document.getElementById("bgm");
  const tapSe = document.getElementById("tapSe");
  if(!bgm){
    console.error("BGM element was not found before game initialization.");
  }
  const countdownOverlay = document.getElementById("countdownOverlay");
  const countdownText = document.getElementById("countdownText");
  const soundToggle = document.getElementById("soundToggle");
  const audioStatus = document.getElementById("audioStatus");
  let soundEnabled = true;
  let audioUnlocked = false;

  let running = false;
  let startAt = 0;
  let raf = 0;
  let notes = [];
  let totalHits = 0;
  let totalMiss = 0;
  let streak = 0;
  let spawnedStage = -1;
  let timers = [];

  const dirMap = {L:"left", R:"right", U:"up", D:"down"};

  function clearTimers(){
    timers.forEach(clearTimeout);
    timers = [];
  }

  function makeDecor(stage){
    // v0.6.2: 背景は本番候補の画像素材で描画するため、旧ボーン小物は使わない。
    scene.innerHTML = "";
  }

  function setStage(stage){
    STAGE_CLASSES.forEach(c => scene.classList.remove(c));
    scene.classList.add(STAGE_CLASSES[stage]);
    makeDecor(stage);
    stageLabel.textContent = `${stage+1}面：${STAGE_NAMES[stage]}`;
  }

  function noteStartPosition(dir){
    const game = document.getElementById("game").getBoundingClientRect();
    const t = targets[dir].getBoundingClientRect();
    const tx = t.left - game.left + t.width/2;
    const ty = t.top - game.top + t.height/2;
    if(dir==="left") return {x:-55,y:ty};
    if(dir==="right") return {x:game.width+55,y:ty};
    if(dir==="up") return {x:tx,y:-55};
    return {x:tx,y:game.height+55};
  }

  function targetCenter(dir){
    const game = document.getElementById("game").getBoundingClientRect();
    const t = targets[dir].getBoundingClientRect();
    return {x:t.left-game.left+t.width/2,y:t.top-game.top+t.height/2};
  }

  function spawnNote(dir, hitTime){
    const el = document.createElement("div");
    el.className = `note ${dir}`;
    el.textContent = {left:"←",right:"→",up:"↑",down:"↓"}[dir];
    document.getElementById("game").appendChild(el);

    const start = noteStartPosition(dir);
    const target = targetCenter(dir);
    el.style.left = (start.x-23)+"px";
    el.style.top = (start.y-23)+"px";

    notes.push({dir, hitTime, el, hit:false, missed:false, start});
    requestAnimationFrame(() => {
      el.style.transition = `transform ${TRAVEL}ms linear, opacity .12s`;
      el.style.transform = `translate(${target.x-start.x}px,${target.y-start.y}px)`;
    });

    timers.push(setTimeout(() => {
      const n = notes.find(x=>x.el===el);
      if(n && !n.hit && !n.missed){
        n.missed = true;
        missFeedback();
      }
      el.style.opacity = "0";
      setTimeout(()=>el.remove(),140);
    }, TRAVEL + MISS_WINDOW));
  }

  function scheduleStage(stage, stageStartMs){
    const phraseCharts = charts[stage];
    phraseCharts.forEach((phrase, pIdx) => {
      phrase.forEach((token, slotIdx) => {
        const slotStart = stageStartMs + (pIdx*8 + slotIdx) * SLOT;
        const chars = token.split("");
        const active = chars.filter(c => dirMap[c]);
        if(!active.length) return;

        // 同一スロットに2音/3音ある場合は、そのスロット内に均等配置
        active.forEach((c, i) => {
          const frac = active.length===1 ? 0.5 : (i+1)/(active.length+1);
          const hitTime = slotStart + frac * SLOT;
          const delay = Math.max(0, hitTime - TRAVEL);
          timers.push(setTimeout(()=>spawnNote(dirMap[c], hitTime), delay));
        });
      });
    });
  }

  function setHiyoSprite(src){
    if(characterSprite && characterSprite.getAttribute("src") !== src){
      characterSprite.setAttribute("src", src);
    }
  }

  function resetHiyoSoon(delay=190){
    clearTimeout(spriteResetTimer);

    const now = performance.now();
    const holdRemaining = Math.max(0, sparkleHoldUntil - now);
    const actualDelay = Math.max(delay, holdRemaining);

    spriteResetTimer = setTimeout(()=>{
      // きらっ保持中に新しい入力が来ても、保持時間までは戻さない
      const remain = Math.max(0, sparkleHoldUntil - performance.now());
      if(remain > 0){
        resetHiyoSoon(remain);
        return;
      }

      setHiyoSprite(SPRITES.idle);
      character.style.transform = "";
      character.classList.remove("sprite-pop","sprite-miss","sparkle-pulse");
      fx.classList.remove("pulse");
      fx.style.opacity = "0";
      charWrap.style.filter = "";
    }, actualDelay);
  }


  function pulseSparkle(){
    if(!character || !fx) return;

    character.classList.remove("sparkle-pulse");
    fx.classList.remove("pulse");
    void character.offsetWidth;
    void fx.offsetWidth;

    character.classList.add("sparkle-pulse");
    fx.classList.add("pulse");
    fx.style.opacity = "1";
    charWrap.style.filter =
      "drop-shadow(0 0 14px #fff) drop-shadow(0 0 24px #9ee8ff)";

    setTimeout(()=>{
      character.classList.remove("sparkle-pulse");
      fx.classList.remove("pulse");
    }, 360);
  }

  function animateCharacter(dir, success=true){
    clearTimeout(spriteResetTimer);
    character.classList.remove("sprite-pop","sprite-miss");
    void character.offsetWidth;

    if(!success){
      sparkleHoldUntil = 0;
      sparkleSuccessCount = 0;
      setHiyoSprite(SPRITES.idle);
      character.style.transform = "";
      character.classList.add("sprite-miss");
      resetHiyoSoon(230);
      return;
    }

    if(performance.now() < sparkleHoldUntil){
      sparkleSuccessCount++;
      fx.style.opacity = "1";
      charWrap.style.filter =
        "drop-shadow(0 0 12px #fff) drop-shadow(0 0 20px #9ee8ff)";

      if(sparkleSuccessCount % SPARKLE_PULSE_EVERY === 0){
        pulseSparkle();
      }

      // 成功が続く限り、きらっ状態を少し先へ延長
      sparkleHoldUntil = performance.now() + SPARKLE_HOLD_MS;
      resetHiyoSoon(SPARKLE_HOLD_MS);
      return;
    }

    if(dir === lastSpriteDir){
      sameDirCount++;
    }else{
      lastSpriteDir = dir;
      sameDirCount = 0;
    }

    let sprite = SPRITES.idle;
    let extraTransform = "";

    if(dir === "left"){
      sprite = sameDirCount % 2 ? SPRITES.leftStrong : SPRITES.leftSoft;
      extraTransform = "translateX(-3px) rotate(-3deg)";
    }else if(dir === "right"){
      sprite = sameDirCount % 2 ? SPRITES.rightStrong : SPRITES.rightSoft;
      extraTransform = "translateX(3px) rotate(3deg)";
    }else if(dir === "up"){
      sprite = SPRITES.wings;
      extraTransform = "translateY(-5px)";
    }else if(dir === "down"){
      sprite = SPRITES.idle;
      extraTransform = "translateY(5px) scaleY(.97)";
    }

    // 3コンボ以上は、通常ポーズのあと短くキラッを挟む。
    setHiyoSprite(sprite);
    character.style.transform = extraTransform;
    character.classList.add("sprite-pop");
    charWrap.style.filter = "drop-shadow(0 0 10px #fff) drop-shadow(0 0 16px #9ee8ff)";

    if(streak >= 3){
      timers.push(setTimeout(()=>{
        sparkleHoldUntil = performance.now() + SPARKLE_HOLD_MS;
        sparkleSuccessCount = 0;
        setHiyoSprite(SPRITES.sparkle);
        character.style.transform = "translateY(-7px) scale(1.02)";
        fx.style.opacity = "1";
        charWrap.style.filter =
          "drop-shadow(0 0 12px #fff) drop-shadow(0 0 20px #9ee8ff)";
      }, 95));

      // きらっポーズを約3モーション分キープ
      resetHiyoSoon(95 + SPARKLE_HOLD_MS);
    }else{
      fx.style.opacity = "1";
      resetHiyoSoon(195);
    }
  }

  function showFeedback(text, good){
    feedback.textContent = text;
    feedback.className = good ? "show good" : "show miss";
    timers.push(setTimeout(()=>feedback.className="",280));
  }

  function hitFeedback(dir){
    totalHits++;
    streak++;
    const magic = Math.min(100, totalHits * 1.5);
    magicBar.style.width = magic + "%";
    showFeedback(streak>=3 ? "ピヨ♪ ノリノリ！" : "ピヨ♪", true);
    animateCharacter(dir,true);
  }

  function missFeedback(){
    totalMiss++;
    streak=0;
    showFeedback("おっと！", false);
    animateCharacter("none",false);
  }

  function press(dir){
    playTapSe();
    if(!running) return;
    const elapsed = performance.now()-startAt;
    let best = null;
    let bestDiff = Infinity;
    for(const n of notes){
      if(n.dir!==dir || n.hit || n.missed) continue;
      const diff = Math.abs(elapsed - n.hitTime);
      if(diff<bestDiff){bestDiff=diff;best=n;}
    }
    if(best && bestDiff<=HIT_WINDOW){
      best.hit=true;
      best.el.style.opacity="0";
      best.el.style.transform += " scale(1.35)";
      targets[dir].classList.add("active");
      timers.push(setTimeout(()=>targets[dir].classList.remove("active"),130));
      hitFeedback(dir);
      timers.push(setTimeout(()=>best.el.remove(),120));
    }else{
      missFeedback();
    }
  }

  function loop(){
    if(!running) return;
    const elapsed = performance.now()-startAt;
    timerLabel.textContent = `${Math.min(60,elapsed/1000).toFixed(1)} / 60.0`;

    const stage = Math.min(3, Math.floor(elapsed/15000));
    if(stage!==spawnedStage){
      spawnedStage=stage;
      setStage(stage);
    }

    if(elapsed>=60000){
      finish();
      return;
    }
    raf=requestAnimationFrame(loop);
  }

  function chooseFlower(){
    const total = totalHits + totalMiss;
    const ratio = total ? totalHits / total : 0;

    // 全ミスでも、ちゃんとお花は咲く。
    if(ratio >= .92) return ["🌻","大きなひまわり"];
    if(ratio >= .80) return ["⭐🌼⭐","おほしさまの花"];
    if(ratio >= .65) return ["🌙🌸","お月さまの花"];
    if(ratio >= .45) return ["💗🌸💗","ハートの花"];
    return ["🌼🌷🌼","ちいさなお花"];
  }

  function resultPhase(name){
    resultOverlay.className = name ? "phase-" + name : "";
  }

  async function playResultSequence(){
    const [flower,name] = chooseFlower();

    resultFlower.textContent = flower;
    resultText.textContent = "";
    resultHint.style.opacity = "0";
    retryBtn.classList.remove("show");

    resultOverlay.style.display = "grid";

    // 0.0–2.0秒：もぐもぐ
    resultHiyo.src = "hiyomaru_result_munch.png";
    resultPhase("munch");
    await wait(2000);

    // 2.0–3.5秒：シャラララーン
    // ここで通常より浮いた感じのキャピ笑顔へ切り替える
    resultHiyo.src = "hiyomaru_result_happy.png";
    resultPhase("magic");
    await wait(1500);

    // 3.5–5.0秒：キラキラの中から花
    resultPhase("flower");
    await wait(1500);

    // 5.0–6.0秒：花の名前を表示
    resultText.textContent = name + "が咲いたよ！";
    resultPhase("text");
    await wait(1000);

    // 6.0秒以降：キャピ笑顔＋花＋結果文で静止
    resultHiyo.src = "hiyomaru_result_happy.png";
    resultPhase("done");
    retryBtn.classList.add("show");
  }

  function finish(){
    running=false;
    cancelAnimationFrame(raf);
    clearTimers();
    document.querySelectorAll(".note").forEach(n=>n.remove());
    if(bgm){ bgm.pause(); bgm.currentTime = 0; }
    playResultSequence();
  }

  function resetGame(){
    clearTimeout(spriteResetTimer);
    sparkleHoldUntil = 0;
    sparkleSuccessCount = 0;
    setHiyoSprite(SPRITES.idle);
    character.style.transform = "";
    character.classList.remove("sprite-pop","sprite-miss");
    lastSpriteDir = "";
    sameDirCount = 0;
    clearTimers();
    document.querySelectorAll(".note").forEach(n=>n.remove());
    notes=[];
    totalHits=0; totalMiss=0; streak=0; spawnedStage=-1;
    magicBar.style.width="0%";
    timerLabel.textContent="0.0 / 60.0";
    setStage(0);
    feedback.className="";
    resultPhase("");
    resultOverlay.style.display="none";
    retryBtn.classList.remove("show");
    if(bgm){ bgm.pause(); bgm.currentTime = 0; }
  }

  

  function showAudioStatus(text){
    if(!audioStatus) return;
    audioStatus.textContent = text;
    audioStatus.classList.add("show");
    setTimeout(()=>audioStatus.classList.remove("show"), 1400);
  }

  function updateSoundButton(){
    if(!soundToggle) return;
    soundToggle.textContent = soundEnabled ? "🔊 音ON" : "🔇 音OFF";
    soundToggle.setAttribute("aria-pressed", soundEnabled ? "false" : "true");
  }

  async function unlockAudioForSafari(){
    if(!bgm || audioUnlocked) return true;
    try{
      bgm.muted = false;
      bgm.volume = 0;
      bgm.currentTime = 0;

      // IMPORTANT: this play() is called directly from the user's tap.
      const p = bgm.play();
      if(p && typeof p.then === "function") await p;

      audioUnlocked = true;
      showAudioStatus("♪ 音声の準備OK");
      return true;
    }catch(err){
      console.warn("Audio unlock failed:", err);
      showAudioStatus("音声を再生できませんでした");
      return false;
    }
  }

  function setGameMusicAudible(){
    if(!bgm) return;
    try{
      bgm.currentTime = 0;
      bgm.muted = !soundEnabled;
      bgm.volume = soundEnabled ? 1 : 0;
      if(bgm.paused){
        const p = bgm.play();
        if(p && typeof p.catch === "function") p.catch(()=>{});
      }
    }catch(e){
      console.warn(e);
    }
  }


  function playTapSe(){
    if(!tapSe || !soundEnabled) return;
    try{
      tapSe.pause();
      tapSe.currentTime = 0;
      tapSe.volume = 0.75;
      const p = tapSe.play();
      if(p && typeof p.catch === "function") p.catch(()=>{});
    }catch(e){}
  }

  function wait(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

  async function runCountdown(){
    countdownOverlay.style.display = "grid";
    for(const step of ["3","2","1","GO!"]){
      countdownText.textContent = step;
      countdownText.className = step === "GO!" ? "go" : "";
      void countdownText.offsetWidth;
      countdownText.classList.add("pop");
      await wait(760);
      countdownText.classList.remove("pop");
    }
    countdownOverlay.style.display = "none";
  }

async function startGame(){
    resetGame();
    startOverlay.style.display="none";
    resultOverlay.style.display="none";

    // iPhone/iPad Safari対策:
    // ユーザーがスタートを押した、その同じ操作の中で音源を開始する。
    // 音源の先頭3.04秒は無音なので、そのまま3→2→1→GO!を表示。
    // GO!終了時にBGM本編へ入るため、途中でplay()し直さない。
    if(bgm && soundEnabled){
      try{
        bgm.pause();
        bgm.currentTime = 0;
        bgm.muted = false;
        bgm.volume = 1;
        const p = bgm.play();
        if(p && typeof p.catch === "function"){
          p.catch(err => {
            console.warn("BGM start failed:", err);
            showAudioStatus("音声を開始できませんでした");
          });
        }
        audioUnlocked = true;
      }catch(err){
        console.warn("BGM start failed:", err);
      }
    }

    await runCountdown();

    running = true;
    startAt = performance.now();

    for(let s=0;s<4;s++){
      scheduleStage(s,s*15000);
    }
    raf=requestAnimationFrame(loop);
  }

  Object.entries(targets).forEach(([dir,el])=>{
    el.addEventListener("pointerdown",e=>{e.preventDefault();press(dir)});
  });

  window.addEventListener("keydown",e=>{
    const map={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down"};
    if(map[e.key]){
      e.preventDefault();
      press(map[e.key]);
    }
  });

  soundToggle.addEventListener("click", async () => {
    soundEnabled = !soundEnabled;
    updateSoundButton();

    if(soundEnabled){
      // A tap on this button is also a valid Safari user gesture.
      if(!audioUnlocked){
        await unlockAudioForSafari();
      }
      if(running && bgm){
        bgm.muted = false;
        bgm.volume = 1;
        if(bgm.paused){
          try{ await bgm.play(); }catch(e){}
        }
      }
      showAudioStatus("🔊 BGM ON");
    }else{
      if(bgm){
        bgm.muted = true;
        bgm.volume = 0;
      }
      showAudioStatus("🔇 BGM OFF");
    }
  });

  updateSoundButton();

  startBtn.addEventListener("click",startGame);
  retryBtn.addEventListener("click",startGame);

  setStage(0);
})();
</script>
</body>
</html>
